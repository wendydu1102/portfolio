<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta-Analysis: Wendy Du</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <main>
        <h1>Codebase Meta-Analysis</h1>
        <p>This page provides an interactive, narrative analysis of this website's codebase, generated from its git history. Scroll down to see the story unfold.</p>

        <div id="scrolly-1">
            <div id="scatter-story">
                <!-- Narrative steps will be generated here by JavaScript -->
            </div>
            <div id="scatter-plot">
                <h2>Commits Over Time</h2>
                <div id="chart"></div>
            </div>
        </div>

        <h2>Summary Statistics</h2>
        <div id="stats">
            <!-- Summary stats will be rendered here -->
        </div>

        <h2>Race for the Biggest File!</h2>
        <dl id="files">
            <!-- Unit visualization will be rendered here -->
        </dl>
    </main>

    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
            <a href="" id="commit-link" target="_blank"></a>
        </dd>
        <dt>Date</dt>
        <dd id="commit-date"></dd>
        <dt>Time</dt>
        <dd id="commit-time"></dd>
        <dt>Author</dt>
        <dd id="commit-author"></dd>
        <dt>Lines Edited</dt>
        <dd id="commit-lines"></dd>
    </dl>
    
    <script src="../global.js" type="module"></script>
    <script src="main.js" type="module"></script>
</body>
</html>
